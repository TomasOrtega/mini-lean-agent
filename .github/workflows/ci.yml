name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run twine check dist/*
      - name: Smoke-test CLI
        run: uv run mini-lean --help

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest --cov=minileanagent --cov-report=term-missing --cov-report=xml


  lean-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/smoke
          auto-config: false
          use-github-cache: true
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Accept a complete Lean file
        run: uv run mini-lean check Smoke.lean --project examples/smoke
      - name: Reject a file containing sorry
        run: |
          if uv run mini-lean check WithSorry.lean --project examples/smoke; then
            echo "Expected the verifier to reject WithSorry.lean"
            exit 1
          fi
