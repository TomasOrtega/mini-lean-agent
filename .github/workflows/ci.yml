name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Verify upstream contract
        run: |
          uv run python - <<'PY'
          import minisweagent
          from minisweagent.agents.default import DefaultAgent
          from minisweagent.environments.local import LocalEnvironment
          from minisweagent.models.litellm_model import LitellmModel

          print("mini-swe-agent", minisweagent.__version__)
          print(DefaultAgent, LocalEnvironment, LitellmModel)
          PY
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run twine check dist/*
      - name: Smoke-test CLI
        run: |
          uv run mini-lean --help
          uv run mini-lean version
          uv run mini-lean check --help

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest --cov=minileanagent --cov-report=term-missing --cov-report=xml

  comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/core
          auto-config: false
          use-github-cache: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Build Lean FRO comparator
        run: |
          git clone --depth 1 --branch v4.33.0 https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          cd "$RUNNER_TEMP/comparator"
          lake build lean4export comparator
      - name: Check proofs with the real comparator
        env:
          MINI_LEAN_TEST_COMPARATOR: ${{ runner.temp }}/comparator/.lake/build/bin/comparator
          COMPARATOR_LEAN4EXPORT: ${{ runner.temp }}/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          # This job checks our own fixtures; production requires upstream's sandbox setup.
          COMPARATOR_LANDRUN: ${{ runner.temp }}/comparator/scripts/fake-landrun.sh
        run: uv run pytest tests/test_comparator_integration.py
