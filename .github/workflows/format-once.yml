name: Format once

on:
  push:
    branches:
      - refactor/upstream-mini-swe-agent

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/upstream-mini-swe-agent
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Apply Ruff formatting
        run: uv run ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/minileanagent tests; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/minileanagent tests
          git commit -m "style: apply ruff formatting"
          git push origin HEAD:refactor/upstream-mini-swe-agent
