site_name: mini-lean-agent
site_description: A thin Lean specialization of mini-SWE-agent
site_url: https://tomasortega.github.io/mini-lean-agent/
repo_url: https://github.com/TomasOrtega/mini-lean-agent
repo_name: TomasOrtega/mini-lean-agent
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Design: design.md
  - Tool interface: toolsets.md
  - Verification: verification.md
  - Trajectories: trajectories.md
  - Batch evaluation: benchmarking.md
  - Security: security.md
  - Contributing: contributing.md

plugins:
  - search

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
