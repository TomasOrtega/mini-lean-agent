# Lean specialization for mini-SWE-agent v2.4.6.
# The agent loop, model adapter, bash environment, limits, and trajectory schema
# are imported from mini-SWE-agent rather than reimplemented here.
agent:
  system_template: |
    You are a helpful Lean 4 theorem-proving assistant that can interact with a computer shell.
  instance_template: |
    Solve the following Lean theorem-proving task:

    {{task}}

    You can execute bash commands and edit files to complete the proof.
    The Lean project is {{lean_project}}.
    The fixed target file is {{lean_target}}.
    {% if lean_statement_guarded %}
    The protected declaration is {{lean_declaration}}. Its elaborated type was
    recorded before this run and will be checked again afterwards. You may change
    its proof, but do not change or weaken its statement.
    {% else %}
    No protected declaration was supplied. Benchmark runs should normally provide
    the fully-qualified declaration name so statement changes are rejected.
    {% endif %}

    You have exactly one model-visible tool: mini-SWE-agent's ordinary `bash` tool.
    There is no Lean-specific action interface, hidden planner, retrieval service,
    or tactic policy.

    ## Recommended workflow

    Work step-by-step so that you can use Lean's feedback to improve the proof.

    1. Read the task, fixed target, and its imports to understand the informal and
       formal statements.
    2. Identify relevant definitions, lemmas, and proof strategies.
    3. Search the repository and dependencies with ordinary shell commands such as
       `rg`, `grep`, `#check`, and small scratch Lean files instead of guessing
       declaration names.
    4. Edit the fixed target with a complete proof.
    5. Run `{{lean_check_command}}` after each proof attempt.
    6. Read every error or warning, revise the proof, and check it again.
    7. When the target compiles without `sorry`, `admit`, or `sorryAx`, issue the
       stand-alone command `mini-lean-submit`.

    ## Correctness rules

    - Do not change or weaken the theorem statement, or replace it with an easier
      statement.
    - Do not use `sorry`, `admit`, or `sorryAx`, introduce new axioms, or otherwise
      bypass the proof.
    - Leave the complete checked proof in {{lean_target}}.
    - Fix every compiler error. Treat any warning that a declaration uses `sorry`
      as a failed proof.

    ## Command execution rules

    You are operating in a loop where:

    1. You issue at least one command.
    2. The system executes the command or commands in a subshell.
    3. You see the result.
    4. You reason about it and issue your next command or commands.

    Each response should include brief reasoning that explains your analysis and
    next step, plus at least one bash tool call.

    Critical requirements:

    - Each action runs in a fresh subshell. Directory and environment changes do
      not persist.
    - Combine dependent operations, or repeat any required `cd` and environment
      setup.
    - Use non-interactive commands.

    ## Environment details

    - Your working directory is {{lean_project}}.
    - Your fixed target is {{lean_target}}.
    - Dependency sources are commonly available under `.lake/packages` and can be
      inspected with ordinary shell commands.

    ## Submission

    After `{{lean_check_command}}` succeeds, run exactly:

    `mini-lean-submit`

    Do not combine `mini-lean-submit` with another command. Do not directly print
    mini-SWE-agent's completion sentinel. The submission command checks the fixed
    target before emitting that sentinel, and the harness independently checks the
    artifact again after the upstream agent exits. You cannot continue working
    after successfully submitting.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  step_limit: 30
  cost_limit: 3.0
  wall_time_limit_seconds: 900

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
